name: 每周更新竞赛数据

# 每周一 02:00(北京时间) 自动重新抓取校内通知并重建站点数据。
# 这是为了对抗"信息聚合站的经典死因: 没人维护 → 数据过期 → 更没人看"。
#
# 只重抓会变的部分(校内通知), PDF 类数据源(教育部目录、西交 A/B 名单)保留在仓库里
# 重新解析 —— 它们一年才变一次, 没必要每次去下载(何况西交附件需要 Referer 头)。
#
# 首次启用请在仓库 Settings → Actions → General → Workflow permissions
# 里选择 "Read and write permissions", 否则最后一步推送会失败。

on:
  schedule:
    # cron 用 UTC。周日 18:00 UTC = 周一 02:00 UTC+8
    - cron: '0 18 * * 0'
  workflow_dispatch:        # 也支持手动点按钮运行

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: python -m pip install --upgrade pip pypdf

      # ---------- 抓取 ----------
      - name: 抓取校内通知
        run: python scripts/crawl_xjtu_notices.py

      # ---------- 解析(用仓库内的 PDF/文本, 幂等) ----------
      - name: 解析教育部竞赛目录
        run: python scripts/parse_moe_catalog.py

      - name: 解析西交 A/B 名单
        run: python scripts/parse_xjtu_ab.py

      # ---------- 构建 ----------
      - name: 合并总表
        run: python scripts/build_master_table.py

      - name: 推断年度节律
        run: python scripts/build_cadence.py

      - name: 打包站点数据
        run: python scripts/build_site_data.py

      - name: 生成 ICS 日历
        run: python scripts/build_calendar.py

      # ---------- 自检(失败则不提交, 保留上一版可用数据) ----------
      - name: 自检
        run: node scripts/test_site.js

      # ---------- 提交 ----------
      - name: 提交变更
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化, 跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            STAMP=$(date -u '+%Y-%m-%d')
            git commit -m "chore(data): 自动更新竞赛数据 ${STAMP}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 汇总
        run: |
          echo "### 数据更新结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "✅ 检测到变更并已提交。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "➖ 数据无变化。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          for path, label in [("data/seed/notices.json", "校内通知"),
                              ("data/seed/cadence.json", "年度节律")]:
              if os.path.exists(path):
                  d = json.load(open(path, encoding="utf-8"))
                  print(f"- {label}: {d.get('count', '?')} 条")
          if os.path.exists("data/seed/notices.json"):
              d = json.load(open("data/seed/notices.json", encoding="utf-8"))
              dates = [n["date"] for n in d["items"]]
              if dates:
                  print(f"- 通知日期范围: {min(dates)} ~ {max(dates)}")
          PY
